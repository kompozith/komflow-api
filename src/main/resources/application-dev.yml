# Profil DEV — ne contient que ce qui diffère de application.yml (base commune).

spring:
  mail:
    # Utile en local pour vérifier rapidement la config SMTP au démarrage.
    test-connection: false

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.kompozith.komflow.features.auth.CustomUserDetailsService: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30          # 30 fichiers de rotation conservés
