# Test profile: in-memory H2, no dependency on env-provided DB_HOST/DB_PORT/...
# Flyway is disabled since its migrations are PostgreSQL-specific — JPA
# (hibernate.ddl-auto: create-drop) builds the schema instead for @DataJpaTest.
server:
  port: 0
  servlet:
    context-path: /api/v1

spring:
  datasource:
    driver-class-name: org.h2.Driver
    # INIT creates the "komflow" schema up front — several repositories use
    # native queries that hardcode the komflow.* schema prefix, so the
    # default_schema mapping alone isn't enough; the schema itself must exist.
    url: jdbc:h2:mem:komflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS komflow
    username: sa
    password: ""

  sql:
    init:
      mode: never

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: komflow

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username: test
    password: test
    from-name: Komflow Test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret-key: "test-secret-key-not-for-production-use-only-in-tests-0123456789"
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000
  issuer: komflow-test
  access-token-expiration-seconds: 3600

app:
  admin:
    email: admin@test.local
    password: test-password
  file-storage:
    path: /tmp/komflow-test
  whatsapp:
    phone-number: ""
    phone-number-id: ""
    business-account-id: ""
    access-token: ""
  cors:
    allowed-origins: "*"

auth:
  cookie:
    name: refresh_token
    path: /
    same-site: Lax
    secure: false
    http-only: true
