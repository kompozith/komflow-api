name: Deploy to production

on:
  push:
    branches:
      - prod

jobs:
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.artifact-name }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🏗️ Build application (skip tests)
        run: mvn clean package -DskipTests

      - name: 🏷️ Generate clean artifact name
        id: artifact-name
        run: |
          CLEAN_BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[\/\:<>|*?\\"]/-/g')
          ARTIFACT_NAME="komflow-backend-${CLEAN_BRANCH_NAME}-${{ github.run_number }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "artifact-name: ${ARTIFACT_NAME}"

      - name: 📋 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.artifact-name }}
          path: target/*.jar
          retention-days: 30

      - name: ✅ Build summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** 📋 JAR uploaded as: ${{ steps.artifact-name.outputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** ✅ Successful (tests skipped)" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: target

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy JAR to VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/prod/komflow-api"
          
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
          target/*.jar \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/prod/komflow-api/komflow-api.jar


      - name: ⚙️ Copy .env file
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            cp /var/www/env/.env.komflow.prod /var/www/prod/komflow-api/.env \
          "

      - name: 🔄 Restart Spring Boot service
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            sudo systemctl daemon-reload && \
            sudo systemctl enable komflow && \
            sudo systemctl restart komflow && \
            sudo systemctl status komflow --no-pager -l \
          "

      - name: 🩺 Health check (with retry)
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            for i in {1..10}; do \
              echo '⏳ Checking health (attempt '$i')...'; \
              if curl -fs http://localhost:${{ secrets.KOMFLOW_API_SERVER_PORT }}/api/v1/swagger-ui/index.html; then \
                echo '✅ App is healthy!'; exit 0; \
              fi; \
              sleep 10; \
            done; \
            echo '❌ App did not become healthy in time'; \
            exit 1 \
          "

      - name: 📜 Fetch app logs if failed
        if: failure()
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            sudo journalctl -u komflow-api -n 100 --no-pager || echo '⚠️ No logs found' \
          "
